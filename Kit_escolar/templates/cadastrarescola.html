{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Escola - KITSEMED</title>
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
</head>
<body>
    <h1>Bem-vindo ao Sistema KITSEMED</h1>
    <h2>Cadastrar Nova Escola</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}  <!-- Isso vai desenhar as caixinhas de Nome e Bairro -->
        <button type="submit">Salvar Escola</button>
    </form>

    <br>
    <a href="{% url 'listarescola' %}">Voltar para a Lista de Escolas</a>
</body>
</html>
